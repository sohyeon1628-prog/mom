<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>생일 케이크</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { --bg: #000; --fg: #f4f4f4; --pink: #ff8fd0; --blue: #3a3aff; --line: #333; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font-family: 'Gowun Dodum', sans-serif; min-height: 100vh; display: flex; justify-content: center; padding: 20px 16px 40px; }
  main { width: 100%; max-width: 480px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .stage { position: relative; width: 100%; aspect-ratio: 1; }
  #out { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  .count { position: absolute; inset: 0; display: grid; place-items: center; font: 72px 'Press Start 2P', monospace; color: var(--pink); text-shadow: 4px 4px 0 var(--blue); pointer-events: none; }
  .count:empty { display: none; }
  .stage { cursor: pointer; }
  .tap { position: absolute; left: 0; right: 0; top: 4%; text-align: center; font-size: 15px; font-weight: 700; color: #ff3f80; pointer-events: none; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .lyrics { width: 100%; text-align: center; font-size: 20px; line-height: 1.8; border: 2px dashed var(--line); padding: 12px; }
  .lyrics small { display: block; font: 10px 'Press Start 2P', monospace; color: #888; margin-bottom: 6px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  button, .btn {
    font: 16px 'Gowun Dodum', sans-serif; font-weight: 700; cursor: pointer; text-decoration: none;
    background: var(--pink); color: #000; border: none; padding: 12px 22px;
    box-shadow: 4px 4px 0 var(--blue);
  }
  button:active, .btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--blue); }
  button.ghost { background: #222; color: var(--fg); }
  button:disabled { opacity: .4; cursor: default; }
  .status { display: flex; align-items: center; gap: 10px; font: 12px 'Press Start 2P', monospace; color: #ff4d4d; min-height: 16px; }
  .status .dot { width: 10px; height: 10px; background: #ff3b3b; animation: blink 1s steps(1) infinite; }
  .meter { width: 120px; height: 8px; background: #222; }
  .meter i { display: block; height: 100%; width: 0; background: #5cff8a; }
  @keyframes blink { 50% { opacity: 0; } }
  .result { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .result video { width: 100%; background: #000; border: 2px solid var(--line); }
  .hint { font-size: 13px; color: #999; text-align: center; line-height: 1.6; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="stage">
    <canvas id="out" width="720" height="720" aria-label="돌아가는 생일 케이크"></canvas>
    <div class="count" id="count"></div>
    <div class="tap" id="tap">🌸 엉덩이를 톡톡 쳐 주세요</div>
  </div>

  <div class="lyrics">
    <small>SING ALONG ♪</small>
    생일 축하합니다<br>생일 축하합니다<br>사랑하는 엄마의<br>생일 축하합니다 ♪
  </div>

  <div class="row" id="ctrl">
    <button id="rec">🎤 노래 녹음 시작</button>
    <button id="wishPrev" class="ghost">🙏 소원 빌기 미리 보기</button>
    <button id="relight" class="ghost" hidden>🕯 초 다시 켜기</button>
    <button id="replay" class="ghost" hidden>🐒 원숭이부터 다시</button>
  </div>
  <div class="status" id="status" hidden><span class="dot"></span><span id="time">00:00</span><span class="meter"><i id="lvl"></i></span></div>
  <div class="row" id="ctrlRec" hidden>
    <button id="wish">🙏 소원 빌기</button>
    <button id="stop" class="ghost">■ 녹음 끝</button>
  </div>
  <div class="row"><button id="blow" hidden>💨 후~ (버튼으로 끄기)</button></div>

  <div class="result" id="result" hidden>
    <video id="preview" controls playsinline></video>
    <div class="row">
      <a class="btn" id="dl" download>⬇ 영상 저장</a>
      <button id="share" class="ghost" hidden>보내기</button>
      <button id="again" class="ghost">다시 녹음</button>
    </div>
  </div>
  <p class="hint">녹음 버튼을 누르면 3초 뒤 시작해요.<br>노래가 끝나면 '소원 빌기' → 멘트가 나오면 마이크에 '후~' 불어 주세요.<br>촛불이 꺼지고 몇 초 뒤 녹음이 자동으로 끝나요. 녹음 중엔 이 탭을 벗어나지 마세요.</p>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ================= 레트로 3D 케이크 ================= */
const LW = 300, OUT = 720, FPS = 15;
const out = document.getElementById('out'), octx = out.getContext('2d');
octx.imageSmoothingEnabled = false;

const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(LW, LW, false);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x000000);
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
camera.position.set(0, 1.6, 6.7); camera.lookAt(0, 0.72, 0);
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const sun = new THREE.DirectionalLight(0xffffff, 0.65); sun.position.set(-2, 3, 4); scene.add(sun);

function canvasTex(w, h, draw, nearest) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (nearest) { t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter; }
  return t;
}
function marble(g, w, h, seed) {
  let s = seed; const R = () => (s = (s * 16807) % 2147483647) / 2147483647;
  g.fillStyle = '#e2a0d4'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 260; i++) {
    g.strokeStyle = R() < .6 ? `rgba(255,225,248,${.15 + R() * .3})` : `rgba(185,105,170,${.12 + R() * .2})`;
    g.lineWidth = 2 + R() * 9;
    const x = R() * w, y = R() * h;
    g.beginPath(); g.moveTo(x, y);
    g.bezierCurveTo(x + (R() - .5) * 200, y + (R() - .5) * 120, x + (R() - .5) * 200, y + (R() - .5) * 120, x + (R() - .5) * 260, y + (R() - .5) * 80);
    g.stroke();
  }
  for (let i = 0; i < 4000; i++) { g.fillStyle = R() < .5 ? 'rgba(255,255,255,.08)' : 'rgba(120,40,110,.08)'; g.fillRect(R() * w, R() * h, 2, 2); }
}

// 옆면: 대리석 + 픽셀 글씨
const sideTex = canvasTex(2048, 300, (g, w, h) => {
  marble(g, w, h, 7);
  const sm = document.createElement('canvas'); sm.width = 256; sm.height = 38;
  const s = sm.getContext('2d');
  s.font = 'bold 30px Arial, Helvetica, sans-serif'; s.textBaseline = 'middle';
  const txt = 'HAPPY BIRTHDAY ', tw = s.measureText(txt).width;
  s.save(); s.scale(256 / tw, 1); s.fillStyle = '#1414e6'; s.fillText(txt, 0, 21); s.restore();
  const d = s.getImageData(0, 0, 256, 38);
  for (let i = 3; i < d.data.length; i += 4) d.data[i] = d.data[i] > 110 ? 255 : 0;
  s.putImageData(d, 0, 0);
  g.imageSmoothingEnabled = false; g.drawImage(sm, 0, 30, w, h - 60);
}, false);
// 윗면: 대리석 + 가장자리 꽃 장식
const topTex = canvasTex(512, 512, (g, w) => {
  marble(g, w, w, 31);
  const cx = w / 2, cols = ['#f6e05a', '#8fd47a', '#ffb3e6', '#ffffff', '#f6e05a', '#9fd8ff'];
  for (let k = 0; k < 36; k++) {
    const a = k / 36 * Math.PI * 2, r = w * .41;
    g.fillStyle = cols[k % cols.length];
    g.beginPath(); g.arc(cx + Math.cos(a) * r, cx + Math.sin(a) * r, 13 + (k % 3) * 4, 0, 7); g.fill();
    g.fillStyle = 'rgba(80,160,80,.8)'; g.beginPath(); g.ellipse(cx + Math.cos(a + .08) * (r - 22), cx + Math.sin(a + .08) * (r - 22), 10, 5, a, 0, 7); g.fill();
  }
}, false);
// 초: 빨강·하양 사선 줄무늬
const candleTex = canvasTex(64, 256, (g, w, h) => {
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#e8203a'; g.lineWidth = 12;
  for (let y = -w; y < h + w; y += 30) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y + w * .9); g.stroke(); }
}, true);

const cake = new THREE.Group(); scene.add(cake);
const R0 = 1.25, CH = 1.15, R1 = .82, CH2 = .72, TOPY = CH / 2 + CH2;
const sideTex2 = canvasTex(1024, 300, (g, w, h) => marble(g, w, h, 19), false);
cake.add(new THREE.Mesh(new THREE.CylinderGeometry(R0, R0, CH, 64, 1), [
  new THREE.MeshLambertMaterial({ map: sideTex }),
  new THREE.MeshLambertMaterial({ map: topTex }),
  new THREE.MeshLambertMaterial({ color: 0xb06aa0 }),
]));
const tier2 = new THREE.Mesh(new THREE.CylinderGeometry(R1, R1, CH2, 64, 1), [
  new THREE.MeshLambertMaterial({ map: sideTex2 }),
  new THREE.MeshLambertMaterial({ map: topTex }),
  new THREE.MeshLambertMaterial({ color: 0xb06aa0 }),
]);
tier2.position.y = CH / 2 + CH2 / 2; cake.add(tier2);
const candle = new THREE.Mesh(new THREE.CylinderGeometry(.045, .045, .62, 16), new THREE.MeshLambertMaterial({ map: candleTex }));
candle.position.y = TOPY + .31; cake.add(candle);
const wick = new THREE.Mesh(new THREE.CylinderGeometry(.008, .008, .06, 6), new THREE.MeshBasicMaterial({ color: 0x111111 }));
wick.position.y = TOPY + .65; cake.add(wick);
const flame = new THREE.Group(); flame.position.y = TOPY + .74; cake.add(flame);
const fOuter = new THREE.Mesh(new THREE.SphereGeometry(1, 12, 10), new THREE.MeshBasicMaterial({ color: 0xff9a20 }));
const fInner = new THREE.Mesh(new THREE.SphereGeometry(1, 12, 10), new THREE.MeshBasicMaterial({ color: 0xfff2a0 }));
fOuter.scale.set(.05, .1, .05); fInner.scale.set(.028, .06, .028); fInner.position.y = -.02;
flame.add(fOuter, fInner);
const glow = new THREE.PointLight(0xffaa40, .5, 2.5); glow.position.y = TOPY + .8; scene.add(glow);

// GIF 같은 색 줄이기 (4×4 디더링)
const small = document.createElement('canvas'); small.width = small.height = LW;
const sctx = small.getContext('2d', { willReadFrequently: true });
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
function dither() {
  const img = sctx.getImageData(0, 0, LW, LW), d = img.data, step = 255 / 6;
  for (let y = 0; y < LW; y++) for (let x = 0; x < LW; x++) {
    const i = (y * LW + x) * 4, th = (BAYER[(y & 3) * 4 + (x & 3)] / 16 - .5) * step;
    for (let c = 0; c < 3; c++) { const v = Math.round((d[i + c] + th) / step) * step; d[i + c] = v < 0 ? 0 : v > 255 ? 255 : v; }
  }
  sctx.putImageData(img, 0, 0);
}

/* ================= 소원 & 촛불 끄기 ================= */
let phase = 'idle', phaseAt = 0, blowAcc = 0, micLevel = 0, autoStopT;
let mode = 'monkey', bloomAt = 0, counting = false;
const nowS = () => performance.now() / 1000;
const WICK_Y = TOPY + .68;
const smoke = [], puffGeo = new THREE.SphereGeometry(1, 8, 6);
function spawnSmoke() {
  for (let i = 0; i < 12; i++) {
    const m = new THREE.Mesh(puffGeo, new THREE.MeshBasicMaterial({ color: 0xc8c8c8, transparent: true, opacity: .8 }));
    m.visible = false; m.userData = { d: i * .13, ph: Math.random() * 6 }; scene.add(m); smoke.push(m);
  }
}
function updSmoke(pt) {
  smoke.forEach(m => {
    const u = pt - m.userData.d;
    if (u < 0 || u > 3.2) { m.visible = false; return; }
    m.visible = true;
    m.position.set(Math.sin(u * 2.2 + m.userData.ph) * .1 * u + u * .1, WICK_Y + u * .5, 0);
    const s = .03 + u * .065; m.scale.set(s, s, s);
    m.material.opacity = .8 * (1 - u / 3.2);
  });
}
function clearSmoke() { smoke.forEach(m => { scene.remove(m); m.material.dispose(); }); smoke.length = 0; }
function setPhase(p) { phase = p; phaseAt = nowS(); blowAcc = 0; updateButtons(); }
function startWish() { if (phase !== 'idle') return; setPhase('wish'); setTimeout(() => { if (phase === 'wish') setPhase('blow'); }, 4000); }
function blowOut() {
  if (phase !== 'blow') return;
  setPhase('out'); spawnSmoke();
  if (recorder && recorder.state === 'recording') autoStopT = setTimeout(stop, 5500);
  else setTimeout(closeMic, 800);
}
function relight() { clearTimeout(autoStopT); clearSmoke(); flame.visible = true; flame.rotation.z = 0; glow.intensity = .5; setPhase('idle'); }
function updateButtons() {
  const rec = !!(recorder && recorder.state === 'recording'), cakeOn = mode === 'cake';
  document.getElementById('wish').hidden = !(rec && cakeOn && phase === 'idle');
  document.getElementById('blow').hidden = phase !== 'blow';
  document.getElementById('wishPrev').hidden = rec || !cakeOn || phase !== 'idle';
  document.getElementById('relight').hidden = rec || phase !== 'out';
  document.getElementById('replay').hidden = rec || !cakeOn;
  document.getElementById('tap').hidden = mode !== 'monkey' || rec || counting;
}

/* ================= 오프닝: 원숭이 엉덩이에서 꽃이 피어요 ================= */
const mkc = (w, h = w) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const lerp = (a, b, t) => a + (b - a) * t, clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const easeOut = t => 1 - Math.pow(1 - t, 3), easeIO = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const MS = OUT / 760, MX = (OUT - 650 * MS) / 2;
const HOLE = { x: MX + 268 * MS, y: 378 * MS };
const P = {
  face: 'M341 162 L456 158 L447 214 C442 238 428 248 428 262 C454 270 458 312 432 330 C412 342 386 337 381 320 L378 262 C366 240 346 200 341 162 Z',
  body: 'M118 468 C100 330 196 254 274 254 C364 254 446 322 432 452 C420 562 344 616 338 682 L222 682 C214 606 134 574 118 468 Z',
  leg: 'M222 682 C214 606 134 574 118 468 C150 560 210 600 240 682 Z',
  crease: 'M270 440 C266 520 262 600 268 680',
  heart: 'M268 306 C302 330 374 328 374 386 C374 432 330 446 300 440 C284 437 272 428 268 420 C264 428 252 437 236 440 C206 446 162 432 164 386 C166 328 234 330 268 306 Z',
};
function buildMonkey() {
  const layer = mkc(OUT), g = layer.getContext('2d');
  const circ = (x, y, r, col) => { g.fillStyle = col; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); };
  g.setTransform(MS, 0, 0, MS, MX, 0);
  let gr = g.createRadialGradient(410, 180, 10, 400, 190, 200);
  gr.addColorStop(0, '#c4c0b0'); gr.addColorStop(.6, '#9a9b8e'); gr.addColorStop(1, '#5e6b66');
  circ(368, 232, 122, gr);
  g.fillStyle = '#b8a99a'; g.fillRect(486, 200, 16, 22);
  circ(290, 200, 13, '#fff'); circ(294, 201, 8, '#2d7393');
  g.fillStyle = '#ff3f80'; g.fill(new Path2D(P.face));
  circ(384, 189, 18, '#fff'); circ(421, 189, 18, '#fff'); circ(386, 190, 11, '#111'); circ(423, 190, 11, '#111');
  circ(401, 246, 2.6, '#a8234f'); circ(413, 246, 2.6, '#a8234f');
  g.fillStyle = '#e0708f'; g.fillRect(386, 294, 34, 7);
  gr = g.createRadialGradient(340, 350, 10, 325, 370, 390);
  gr.addColorStop(0, '#b9b6a6'); gr.addColorStop(.55, '#8f9285'); gr.addColorStop(1, '#55635d');
  g.fillStyle = gr; g.fill(new Path2D(P.body));
  gr = g.createLinearGradient(0, 468, 0, 682); gr.addColorStop(0, 'rgba(63,77,73,0)'); gr.addColorStop(1, 'rgba(63,77,73,.55)');
  g.fillStyle = gr; g.fill(new Path2D(P.leg));
  g.strokeStyle = 'rgba(74,88,83,.45)'; g.lineWidth = 5; g.stroke(new Path2D(P.crease));
  g.fillStyle = '#ff3f80'; g.fill(new Path2D(P.heart));
  circ(268, 378, 4, '#5a1c32');
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = 'source-atop';
  for (let i = 0; i < 60000; i++) {
    g.fillStyle = Math.random() < .55 ? `rgba(255,255,255,${Math.random() * .22})` : `rgba(30,40,40,${Math.random() * .16})`;
    g.fillRect(Math.random() * OUT, Math.random() * OUT, 1.6, 1.6);
  }
  const c = mkc(OUT), cg = c.getContext('2d');
  cg.fillStyle = '#ffffff'; cg.fillRect(0, 0, OUT, OUT);
  const gx1 = MX + 500 * MS, gy0 = 680 * MS;
  for (let i = 0; i < 30000; i++) {
    const x = Math.random() * gx1, y = gy0 + Math.random() * (OUT - gy0);
    if (Math.random() < (x / gx1) ** 4 * .7) continue;
    cg.fillStyle = `rgba(20,20,20,${.35 + Math.random() * .65})`; cg.fillRect(x, y, 1 + Math.random() * 1.5, 1 + Math.random() * 1.5);
  }
  cg.drawImage(layer, 0, 0);
  return c;
}
const monkeyImg = buildMonkey();
const flowerCv = mkc(OUT), fctx = flowerCv.getContext('2d');
const PET = [{ n: 12, col: '#ff3f80', len: 1, w: .44, off: 0 }, { n: 10, col: '#ff6fa3', len: .78, w: .42, off: .31 }, { n: 8, col: '#ffb8d0', len: .55, w: .4, off: .2 }];
function drawFlower(g, cx, cy, R, open, rot) {
  if (R <= 0) return;
  g.save(); g.translate(cx, cy); g.rotate(rot);
  if (open < .5) {
    g.fillStyle = '#5c9a5c';
    [[-1, .5], [1, -.5]].forEach(([s, r]) => { g.save(); g.rotate(s * .9); g.beginPath(); g.ellipse(0, -R * .28, R * .16, R * .36, 0, 0, 7); g.globalAlpha = 1 - open * 2; g.fill(); g.restore(); });
  }
  PET.forEach(L => {
    for (let k = 0; k < L.n; k++) {
      let fin = k / L.n * Math.PI * 2 + L.off; if (fin > Math.PI) fin -= Math.PI * 2;
      const a = lerp((k / L.n - .5) * .55, fin, open), len = R * L.len * lerp(.8, 1, open), w = L.w * lerp(.55, 1, open);
      g.save(); g.rotate(a);
      g.beginPath(); g.moveTo(0, 0);
      g.bezierCurveTo(len * w, -len * .25, len * w * .9, -len * .85, 0, -len);
      g.bezierCurveTo(-len * w * .9, -len * .85, -len * w, -len * .25, 0, 0);
      g.fillStyle = L.col; g.fill();
      g.strokeStyle = 'rgba(150,20,60,.28)'; g.lineWidth = Math.max(1, R * .008); g.stroke();
      g.beginPath(); g.moveTo(0, -len * .15); g.lineTo(0, -len * .72); g.strokeStyle = 'rgba(255,255,255,.3)'; g.stroke();
      g.restore();
    }
  });
  if (open > 0) {
    g.fillStyle = '#ffd84d'; g.beginPath(); g.arc(0, 0, R * .13 * open, 0, 7); g.fill();
    g.fillStyle = '#e8a020'; for (let k = 0; k < 10; k++) { const a = k * 2.4; g.beginPath(); g.arc(Math.cos(a) * R * .07 * open, Math.sin(a) * R * .07 * open, R * .012 + .5, 0, 7); g.fill(); }
  }
  g.restore();
}
const BLOOM = 4.3;
function drawBloom(u) {
  let R, open = 0, cx = HOLE.x, cy = HOLE.y, rot = 0;
  if (u < 1) R = lerp(0, 44, easeOut(clamp((u - .25) / .75)));
  else if (u < 2) { const p = easeIO(u - 1); R = lerp(44, 100, p); open = p; rot = p * .3; }
  else { const p = easeIO(clamp((u - 2) / 1.3)); R = lerp(100, 760, p); open = 1; rot = .3 + p * .6; cx = lerp(HOLE.x, OUT / 2, p); cy = lerp(HOLE.y, OUT / 2, p); }
  const hp = clamp((u - 3.05) / 1.1), hole = easeIO(hp) * 1000;
  if (hole > 0) octx.drawImage(small, 0, 0, OUT, OUT);
  else {
    const sq = u < .7 ? Math.sin(u / .7 * Math.PI) * .045 : 0, base = 646;
    octx.fillStyle = '#fff'; octx.fillRect(0, 0, OUT, OUT);
    octx.save(); octx.translate(OUT / 2, base); octx.scale(1 + sq * .6, 1 - sq); octx.translate(-OUT / 2, -base);
    octx.drawImage(monkeyImg, 0, 0); octx.restore();
  }
  fctx.clearRect(0, 0, OUT, OUT);
  drawFlower(fctx, cx, cy, R + hole * .7, open, rot + hp * .5);
  if (hole > 0) {
    fctx.save(); fctx.globalCompositeOperation = 'destination-out';
    const gr = fctx.createRadialGradient(cx, cy, 0, cx, cy, hole);
    gr.addColorStop(0, 'rgba(0,0,0,1)'); gr.addColorStop(.8, 'rgba(0,0,0,1)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    fctx.fillStyle = gr; fctx.fillRect(0, 0, OUT, OUT); fctx.restore();
  }
  octx.save(); octx.globalAlpha = 1 - clamp((u - 3.7) / .6); octx.drawImage(flowerCv, 0, 0); octx.restore();
}
let taps = 0, jiggleAt = -9;
function startBloom() { if (mode !== 'monkey') return; mode = 'bloom'; bloomAt = performance.now() / 1000; updateButtons(); }
function resetMonkey() { mode = 'monkey'; taps = 0; relight(); updateButtons(); }
function compose(now) {
  if (mode === 'monkey') {
    const j = now / 1000 - jiggleAt, sq = j < .35 ? Math.sin(j / .35 * Math.PI * 2) * .035 * (1 - j / .35) : 0;
    octx.fillStyle = '#fff'; octx.fillRect(0, 0, OUT, OUT);
    octx.save(); octx.translate(OUT / 2, 646); octx.scale(1 + sq, 1 - sq); octx.translate(-OUT / 2, -646);
    octx.drawImage(monkeyImg, 0, 0); octx.restore();
  }
  else if (mode === 'bloom') {
    const u = now / 1000 - bloomAt;
    if (u >= BLOOM) { mode = 'cake'; updateButtons(); octx.drawImage(small, 0, 0, OUT, OUT); }
    else drawBloom(u);
  } else octx.drawImage(small, 0, 0, OUT, OUT);
}

// 화면 위 픽셀 글씨
function pixText(s, x, y, font, col) {
  sctx.font = font; sctx.fillStyle = '#1414e6'; sctx.fillText(s, x + 2, y + 2);
  sctx.fillStyle = col; sctx.fillText(s, x, y);
}
const SPK = [[70, 70], [228, 64], [96, 112], [206, 118], [120, 40], [184, 36], [52, 128], [250, 132]];
function overlay() {
  const pt = nowS() - phaseAt;
  sctx.save(); sctx.textAlign = 'center';
  if (phase === 'wish') {
    sctx.globalAlpha = Math.min(1, pt / .6);
    pixText('MAKE A WISH', 150, 20, '10px "Press Start 2P"', '#ffe14d');
    pixText('소원을 빌어요', 150, 44, 'bold 19px "Gowun Dodum"', '#ffffff');
    SPK.forEach(([x, y], i) => {
      if ((Math.floor(pt * 6) + i) % 3 === 0) return;
      sctx.fillStyle = i % 2 ? '#ffe14d' : '#ffffff';
      sctx.fillRect(x - 1, y - 4, 2, 8); sctx.fillRect(x - 4, y - 1, 8, 2);
    });
  } else if (phase === 'blow') {
    if (Math.floor(pt * 2.5) % 2 === 0) pixText('후~ 하고 불어 주세요', 150, 36, 'bold 17px "Gowun Dodum"', '#ffffff');
  } else if (phase === 'out' && pt > 1.4) {
    const u = pt - 1.4;
    const cc = ['#ff8fd0', '#ffe14d', '#5cff8a', '#6ec8ff', '#ffffff'];
    for (let i = 0; i < 46; i++) {
      sctx.fillStyle = cc[i % 5];
      sctx.fillRect((i * 67 + Math.sin(u * 3 + i) * 6) % 300, ((u * (40 + (i % 5) * 10) + i * 53) % 320) - 10, 3, 3);
    }
    sctx.globalAlpha = Math.min(1, u / .5);
    pixText('HAPPY', 150, 22, '14px "Press Start 2P"', '#ff8fd0');
    pixText('BIRTHDAY!', 150, 44, '14px "Press Start 2P"', '#ff8fd0');
  }
  sctx.restore();
}

let last = 0, angle = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (now - last >= 1000 / FPS) cakeTick(now);
  compose(now);
}
function cakeTick(now) {
  const dt = Math.min(.2, (now - last) / 1000); last = now;
  angle -= dt * Math.PI * 2 / 6;
  cake.rotation.y = angle;
  if (phase === 'out') {
    const pt = nowS() - phaseAt;
    if (pt < .45) {
      const k = 1 - pt / .45;
      flame.visible = true; flame.rotation.z = -1.1 * (1 - k);
      flame.scale.set(k * (1 + Math.random() * .4), k * (.5 + Math.random() * .7), k);
      glow.intensity = .5 * k;
    } else { flame.visible = false; glow.intensity = 0; }
    updSmoke(pt);
  } else {
    const f = 1 + (Math.random() - .5) * .3, sway = phase === 'blow' ? Math.min(1, micLevel * 1.4) : 0;
    flame.scale.set(1 / Math.sqrt(f), f * (1 - sway * .3), 1 / Math.sqrt(f));
    flame.rotation.z = (Math.random() - .5) * .15 - sway * .7;
    glow.intensity = .4 + Math.random() * .2;
  }
  if (phase === 'blow' && micStream && micStream.active) {
    if (micLevel > .45) blowAcc += dt; else blowAcc = Math.max(0, blowAcc - dt * .5);
    if (blowAcc > .25) blowOut();
  }
  renderer.render(scene, camera);
  sctx.drawImage(renderer.domElement, 0, 0); dither(); overlay();
}
requestAnimationFrame(frame);

/* ================= 녹음 ================= */
const $ = id => document.getElementById(id);
let recorder, micStream, chunks = [], timer, startAt, analyser, meterRaf, fileBlob, fileName;
const TYPES = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
const show = (id, on) => $(id).hidden = !on;

// 마이크 열기: 오디오 장치는 버튼을 누른 그 순간에 깨워야 핸드폰에서 동작해요
let ac;
async function openMic() {
  if (micStream && micStream.active) return true;
  if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
  if (ac.state === 'suspended') ac.resume();
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
  } catch (e) { alert('마이크를 쓸 수 없어요. 브라우저 주소창 옆에서 마이크 권한을 허용해 주세요.'); return false; }
  if (ac.state === 'suspended') await ac.resume().catch(() => {});
  analyser = ac.createAnalyser(); analyser.fftSize = 1024;
  ac.createMediaStreamSource(micStream).connect(analyser);
  const buf = new Float32Array(analyser.fftSize);
  cancelAnimationFrame(meterRaf);
  (function meter() {
    analyser.getFloatTimeDomainData(buf);
    let sum = 0; for (const v of buf) sum += v * v;
    micLevel = Math.min(1, Math.sqrt(sum / buf.length) * 4);
    $('lvl').style.width = micLevel * 100 + '%';
    meterRaf = requestAnimationFrame(meter);
  })();
  return true;
}
function closeMic() { cancelAnimationFrame(meterRaf); if (micStream) micStream.getTracks().forEach(t => t.stop()); micStream = null; micLevel = 0; }

$('rec').onclick = async () => {
  if (!(await openMic())) return;
  show('ctrl', false); show('result', false);
  relight(); mode = 'cake'; counting = true; updateButtons();
  for (const n of ['3', '2', '1']) { $('count').textContent = n; await new Promise(r => setTimeout(r, 1000)); }
  $('count').textContent = ''; counting = false;
  const type = TYPES.find(t => MediaRecorder.isTypeSupported(t));
  const stream = new MediaStream([...out.captureStream(30).getVideoTracks(), ...micStream.getAudioTracks()]);
  recorder = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 6000000 });
  chunks = [];
  recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
  recorder.onstop = () => done(type);
  recorder.start(500);
  startAt = Date.now();
  show('status', true); show('ctrlRec', true); updateButtons();
  timer = setInterval(() => {
    const s = Math.floor((Date.now() - startAt) / 1000);
    $('time').textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
    if (s >= 120) stop();
  }, 250);
};
function stop() {
  if (!recorder || recorder.state === 'inactive') return;
  recorder.stop(); clearInterval(timer); clearTimeout(autoStopT); closeMic();
  show('status', false); show('ctrlRec', false);
}
$('stop').onclick = stop;
$('wish').onclick = startWish;
$('wishPrev').onclick = async () => { await openMic(); startWish(); };
$('blow').onclick = blowOut;
$('relight').onclick = relight;
$('replay').onclick = resetMonkey;
document.querySelector('.stage').onclick = () => {
  if (mode !== 'monkey' || counting) return;
  taps++; jiggleAt = performance.now() / 1000;
  if (taps >= 2) setTimeout(startBloom, 250);
};
updateButtons();
document.fonts.load('bold 19px "Gowun Dodum"', '소원을 빌어요 후~ 하고 불어 주세요').catch(() => {});
document.fonts.load('10px "Press Start 2P"', 'MAKE A WISH HAPPY BIRTHDAY!').catch(() => {});
function done(type) {
  const ext = type.includes('mp4') ? 'mp4' : 'webm';
  fileBlob = new Blob(chunks, { type: type.split(';')[0] });
  fileName = `생일축하-노래.${ext}`;
  const url = URL.createObjectURL(fileBlob);
  $('preview').src = url; $('dl').href = url; $('dl').download = fileName;
  const file = new File([fileBlob], fileName, { type: fileBlob.type });
  show('share', !!(navigator.canShare && navigator.canShare({ files: [file] })));
  $('share').onclick = () => navigator.share({ files: [file], title: '생일 축하해요' }).catch(() => {});
  show('result', true); show('ctrl', true); updateButtons();
  $('rec').textContent = '🎤 다시 녹음';
}
$('again').onclick = () => $('rec').click();
</script>
